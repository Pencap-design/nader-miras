<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نادر · رونمایی کالکشن میراث — دعوت‌نامه چاپی</title>
<!--
  Printed invitation · A5 landscape (210 × 148 mm) + 3 mm bleed = 216 × 154 mm.
  Keep all type inside the safe area (8 mm from trim). Copy comes from ../js/config.js.
  Build: see print/build.sh
-->
<style>
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Thin.woff2") format("woff2"); font-weight: 100; }
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Light.woff2") format("woff2"); font-weight: 300; }
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Cormorant Garamond"; src: url("../assets/fonts/Cormorant-Medium-subset.woff2") format("woff2"); font-weight: 500; }

  @page { size: 216mm 154mm; margin: 0; }

  :root {
    --bleed: 3mm;
    --wine: #4a0f1a;
    --wine-deep: #2a060d;
    --wine-mid: #5e1624;
    --gold: #a8854e;
    --gold-soft: rgba(168, 133, 78, .6);
    --gold-light: #d9c08c;
    --cream: #f4ecdc;
    --cream-2: #ece0c8;
    --ink: #3a0c15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  address { font-style: normal; }
  html, body { background: #777; }
  body {
    font-family: "Doran", sans-serif; font-weight: 400;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    -webkit-font-smoothing: antialiased;
  }
  @media screen { body { display: grid; gap: 10mm; padding: 10mm; justify-content: center; } }

  .page {
    position: relative; overflow: hidden;
    width: 216mm; height: 154mm;
    page-break-after: always; break-after: page;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* trim & safe guides (screen only) */
  @media screen {
    .page::after { content: ""; position: absolute; inset: var(--bleed); outline: .3mm dashed rgba(0,160,255,.5); pointer-events: none; z-index: 99; }
  }

  /* ---------- shared textures ---------- */
  .leather {
    background:
      radial-gradient(90% 80% at 50% 45%, #58141f 0%, #3d0c15 45%, #23060b 100%);
  }
  .grain { position: absolute; inset: 0; pointer-events: none; }
  .grain svg { width: 100%; height: 100%; display: block; }

  .paper {
    background:
      radial-gradient(120% 100% at 60% 40%, #f7f0e3 0%, var(--cream) 55%, var(--cream-2) 100%);
  }

  /* ---------- engraved frame ---------- */
  .frame { position: absolute; pointer-events: none; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .frame rect, .frame path { fill: none; vector-effect: non-scaling-stroke; }

  /* =========================================================
     PAGE 1 · COVER
     ========================================================= */
  .cover { color: var(--gold-light); }
  .cover .frame { inset: calc(var(--bleed) + 7mm); }
  .cover .frame .o { stroke: rgba(217, 192, 140, .55); stroke-width: 1.4; }
  .cover .frame .i { stroke: rgba(217, 192, 140, .28); stroke-width: 1.0; }
  .cover .frame .n { stroke: rgba(217, 192, 140, .6); stroke-width: 1.2; }
  .cover .frame .dm { fill: #3a0b15; stroke: rgba(217, 192, 140, .7); stroke-width: 1.2; }

  .cover__body {
    position: absolute; inset: 0;
    display: grid; justify-items: center; align-content: center;
    gap: 7mm;
  }
  .seal {
    position: relative; width: 66mm; height: 66mm; border-radius: 50%;
    display: grid; place-items: center;
    box-shadow: 0 3mm 7mm rgba(0,0,0,.45), 0 .6mm 1.4mm rgba(0,0,0,.35);
  }
  .seal svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seal img { position: relative; width: 50%; filter: sepia(.15) saturate(.85) brightness(.95); }
  .cover__title { font-size: 12.5pt; font-weight: 400; color: var(--gold-light); opacity: .92; }
  .cover__latin {
    font-family: "Cormorant Garamond", serif; font-weight: 500;
    font-size: 8.5pt; letter-spacing: .7em; margin-right: -.7em;
    color: var(--gold); display: flex; align-items: center; gap: 4mm; direction: ltr;
  }
  .cover__latin i { display: block; width: 9mm; height: .3mm; background: linear-gradient(90deg, transparent, var(--gold)); }
  .cover__latin i:last-child { background: linear-gradient(90deg, var(--gold), transparent); }

  /* =========================================================
     PAGE 2 · INSIDE
     ========================================================= */
  .inside { display: grid; grid-template-columns: 76mm 1fr; }

  /* burgundy panel — on the right, where a Persian reader begins */
  .panel {
    position: relative; overflow: hidden;
    color: var(--cream);
    display: grid; grid-template-rows: 1fr auto;
    padding: calc(var(--bleed) + 14mm) calc(var(--bleed) + 10mm) calc(var(--bleed) + 10mm) 10mm;
  }
  .panel::before { /* carved rosette, half hidden at the fold */
    content: ""; position: absolute; left: -38mm; top: 50%; width: 76mm; height: 76mm; translate: 0 -50%;
    background: var(--rosette) center / contain no-repeat; opacity: .13;
  }
  .panel::after { /* gold edge where panel meets paper */
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .35mm;
    background: linear-gradient(to bottom, transparent, var(--gold) 12%, var(--gold-light) 50%, var(--gold) 88%, transparent);
  }
  .panel__top { position: relative; display: grid; justify-items: center; align-content: start; text-align: center; }
  .panel__logo { width: 22mm; margin-bottom: 5mm; filter: sepia(.15) saturate(.85) brightness(.95); }
  .panel__house { font-size: 12pt; line-height: 1.6; color: #c9ad78; margin-bottom: -.5mm; }
  .panel__brand {
    font-weight: 500; font-size: 30pt; line-height: 1.2;
    color: #d4b882;
  }
  .panel__rule { width: .3mm; height: 9mm; margin: 5mm 0; background: linear-gradient(to bottom, transparent, var(--gold-soft), transparent); }
  .panel__lines { font-size: 11.5pt; line-height: 2.05; color: #eadbc0; }
  .panel__lines span { display: block; }

  .panel__qr { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 3.5mm; }
  .qr-plate {
    width: 19mm; height: 19mm; padding: 1.6mm; background: var(--cream);
    box-shadow: 0 0 0 .25mm var(--gold), 0 0 0 .9mm #3f0c16, 0 0 0 1.1mm rgba(217,192,140,.5);
  }
  .qr-plate img { display: block; width: 100%; height: 100%; }
  .qr-caption { font-size: 8.5pt; line-height: 1.9; color: #d8c49e; }
  .qr-caption b { display: block; font-weight: 500; font-size: 9.2pt; color: var(--gold-light); }

  /* cream side */
  .sheet { position: relative; color: var(--ink); }
  .sheet .frame { inset: calc(var(--bleed) + 7mm) 7mm calc(var(--bleed) + 7mm) calc(var(--bleed) + 7mm); }
  .sheet .frame .o { stroke: rgba(122, 88, 44, .55); stroke-width: 1.3; }
  .sheet .frame .i { stroke: rgba(122, 88, 44, .28); stroke-width: 1.0; }
  .sheet .frame .n { stroke: rgba(122, 88, 44, .6); stroke-width: 1.2; }
  .sheet .frame .dm { fill: var(--cream); stroke: rgba(122, 88, 44, .7); stroke-width: 1.2; }

  .sheet__watermark {
    position: absolute; left: 50%; top: 44%; width: 96mm; height: 96mm; translate: -50% -50%;
    background: var(--rosette-ink) center / contain no-repeat; opacity: .045;
  }
  .sheet__body {
    position: absolute;
    inset: calc(var(--bleed) + 15mm) 16mm calc(var(--bleed) + 13mm) calc(var(--bleed) + 16mm);
    display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center;
  }

  .guest { display: flex; align-items: baseline; gap: 3mm; font-size: 9.8pt; color: #6b4a3a; width: 78mm; }
  .guest span { white-space: nowrap; }
  .guest i { flex: 1; border-bottom: .35mm dotted rgba(122, 88, 44, .7); transform: translateY(-1mm); }

  .hero { display: grid; justify-items: center; align-content: center; }
  .hero__unveil { font-size: 11pt; color: var(--gold); margin-bottom: 1.5mm; }
  .hero__miras {
    font-weight: 500; font-size: 64pt; line-height: 1.12; color: var(--wine);
  }
  .hero__latin {
    font-family: "Cormorant Garamond", serif; font-weight: 500;
    font-size: 9.5pt; letter-spacing: .72em; color: #8f6a38;
    display: flex; align-items: center; gap: 4mm; direction: ltr; margin-top: .5mm;
  }
  .hero__latin span { margin-right: -.72em; }
  .hero__latin i { display: block; width: 10mm; height: .3mm; background: linear-gradient(90deg, transparent, var(--gold)); }
  .hero__latin i:last-child { background: linear-gradient(90deg, var(--gold), transparent); }

  .details { display: grid; grid-template-columns: 1fr auto 1fr auto 1.35fr; align-items: start; width: 100%; }
  .detail { display: grid; justify-items: center; gap: 2mm; }
  .detail .glyph { width: 6mm; height: 6mm; color: var(--gold); }
  .detail .glyph svg { width: 100%; height: 100%; display: block; }
  .detail__big { font-size: 17pt; line-height: 1.3; color: var(--wine); font-weight: 500; }
  .detail__addr { font-size: 9.8pt; line-height: 1.85; color: var(--ink); }
  .detail__addr span { display: block; }
  .detail__addr span:last-child { color: var(--wine); font-weight: 500; font-size: 10.5pt; }
  .vrule { position: relative; width: .25mm; height: 18mm; margin-top: 2mm; background: linear-gradient(to bottom, rgba(168,133,78,0), rgba(168,133,78,.85) 50%, rgba(168,133,78,0)); }
  .vrule::after { content: ""; position: absolute; left: 50%; top: 50%; width: 1.4mm; height: 1.4mm; translate: -50% -50%; rotate: 45deg; border: .3mm solid var(--gold); background: var(--cream); }
  /* ---------- print strength (press check: thin type & hairlines fill in) ---------- */
  .glyph svg * { stroke-width: 1.55; }
  .frame .n { stroke-width: 1.2 !important; }
</style>
</head>
<body>

<!-- ========== PAGE 1 · COVER ========== -->
<section class="page cover leather">
  <div class="grain" data-grain="dark"></div>
  <div class="frame" data-frame></div>
  <div class="cover__body">
    <div class="seal" data-seal></div>
    <p class="cover__title" data-copy="event.title"></p>
    <p class="cover__latin"><i></i><span data-copy="event.collectionLatin"></span><i></i></p>
  </div>
</section>

<!-- ========== PAGE 2 · INSIDE ========== -->
<section class="page inside">
  <aside class="panel leather">
    <div class="grain" data-grain="dark"></div>
    <div class="panel__top">
      <img class="panel__logo" data-logo alt="">
      <p class="panel__house" data-copy="event.brandHouse"></p>
      <p class="panel__brand" data-copy="event.brand"></p>
      <span class="panel__rule"></span>
      <p class="panel__lines" data-lines="inviteLines"></p>
    </div>
    <div class="panel__qr">
      <div class="qr-plate"><img src="qr.svg" alt="QR"></div>
      <p class="qr-caption"><b>دعوت‌نامه‌ی دیجیتال</b>تأیید حضور و مسیر مراسم</p>
    </div>
  </aside>

  <div class="sheet paper">
    <div class="grain" data-grain="light"></div>
    <div class="sheet__watermark"></div>
    <div class="frame" data-frame></div>
    <div class="sheet__body">
      <p class="guest"><span>میهمان گرامی</span><i></i></p>

      <div class="hero">
        <p class="hero__unveil" data-copy="unveil"></p>
        <h1 class="hero__miras" data-copy="event.collection"></h1>
        <p class="hero__latin"><i></i><span data-copy="event.collectionLatin"></span><i></i></p>
      </div>

      <div class="details">
        <div class="detail"><span class="glyph" data-glyph="rosette"></span><p class="detail__big" data-copy="event.date"></p></div>
        <span class="vrule"></span>
        <div class="detail"><span class="glyph" data-glyph="dusk"></span><p class="detail__big" data-copy="event.time"></p></div>
        <span class="vrule"></span>
        <div class="detail"><span class="glyph" data-glyph="gate"></span><address class="detail__addr" data-lines="event.address"></address></div>
      </div>
    </div>
  </div>
</section>

<script src="../js/config.js"></script>
<script src="../js/motifs.js"></script>
<script>
  const C = window.NADER_CONFIG, M = window.NADER_MOTIFS;
  const get = (p) => p.split(".").reduce((o, k) => o && o[k], { ...C.copy, event: C.event });
  const $$ = (s) => [...document.querySelectorAll(s)];
  const svgURL = (svg) => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;

  $$("[data-copy]").forEach((el) => { el.textContent = get(el.dataset.copy); });
  $$("[data-lines]").forEach((el) => {
    get(el.dataset.lines).forEach((l) => { const s = document.createElement("span"); s.textContent = l; el.appendChild(s); });
  });
  $$("[data-glyph]").forEach((el) => { el.innerHTML = M.glyphs[el.dataset.glyph]; });
  $$("[data-logo]").forEach((el) => { el.src = "../" + C.assets.logo; });
  $$("[data-seal]").forEach((el) => {
    el.innerHTML = M.sealRings() + `<img src="../${C.assets.logo}" alt="${C.event.brand}">`;
  });

  // carved rosettes: gold on the panel, ink watermark on the paper
  const root = document.documentElement.style;
  root.setProperty("--rosette", svgURL(M.doorArt()));
  root.setProperty("--rosette-ink", svgURL(M.doorArt().replaceAll("#c9a86e", "#5a1a22")));

  // paper / leather grain (vector filter, rendered at print resolution)
  const grain = (tone) => `<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 800 600">
    <filter id="g${tone}"><feTurbulence type="fractalNoise" baseFrequency="${tone === "dark" ? ".9" : "1.1"}" numOctaves="3" seed="${tone === "dark" ? 7 : 3}"/>
    <feColorMatrix values="0 0 0 0 ${tone === "dark" ? ".06" : ".45"}  0 0 0 0 ${tone === "dark" ? ".01" : ".34"}  0 0 0 0 ${tone === "dark" ? ".0" : ".2"}  0 0 0 ${tone === "dark" ? ".5" : ".2"} 0"/></filter>
    <rect width="800" height="600" filter="url(#g${tone})"/>
    <filter id="m${tone}"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="11"/>
    <feColorMatrix values="0 0 0 0 ${tone === "dark" ? ".03" : ".55"}  0 0 0 0 ${tone === "dark" ? ".0" : ".42"}  0 0 0 0 ${tone === "dark" ? ".0" : ".26"}  0 0 0 ${tone === "dark" ? ".45" : ".07"} 0"/></filter>
    <rect width="800" height="600" filter="url(#m${tone})"/></svg>`;
  $$("[data-grain]").forEach((el) => { el.innerHTML = grain(el.dataset.grain); });

  // engraved frames sized to their boxes (mm → px at 96dpi)
  $$("[data-frame]").forEach((el) => {
    const { width: w, height: h } = el.getBoundingClientRect();
    const i = 7, s = 9;
    const notch = (x, y, sx, sy) => `<path class="n" d="M${x} ${y + sy * s} h${sx * 4} v${-sy * 4} h${sx * 4} v${-sy * 4} h${sx * 2}"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}">
      <rect class="o" x="0" y="0" width="${w}" height="${h}"/>
      <rect class="i" x="${i}" y="${i}" width="${w - 2 * i}" height="${h - 2 * i}"/>
      ${notch(i, i, 1, 1)}${notch(w - i, i, -1, 1)}${notch(i, h - i, 1, -1)}${notch(w - i, h - i, -1, -1)}
      <path class="dm" d="M${w / 2} ${-4} l4 4 l-4 4 l-4 -4 Z"/>
      <path class="dm" d="M${w / 2} ${h - 4} l4 4 l-4 4 l-4 -4 Z"/></svg>`;
  });
</script>
</body>
</html>
