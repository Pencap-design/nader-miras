<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>نادر · کالکشن میراث — بروشور سه‌لت</title>
<!--
  Tri-fold (roll fold) brochure · A4 landscape 297 × 210 mm + 3 mm bleed = 303 × 216 mm.
  Panels (trim, left → right as the sheet lies on the table):
    OUTSIDE:  front cover 100 | back 100 | inner flap 97
    INSIDE:   product ۳ 97    | product ۲ 100 | product ۱ 100
  The 97 mm panel is the one that folds in first. Persian reading is right-to-left, so
  the whole sheet is the mirror of a Latin brochure. Copy lives in content.js.
  Add ?guides to the URL to see trim / fold / safe lines.
-->
<style>
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Thin.woff2") format("woff2"); font-weight: 100; }
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Light.woff2") format("woff2"); font-weight: 300; }
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Doran"; src: url("../assets/fonts/Doran-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Cormorant"; src: url("../assets/fonts/Cormorant-Medium-subset.woff2") format("woff2"); font-weight: 500; }

  @page { size: 303mm 216mm; margin: 0; }

  :root {
    --b: 3mm;
    --wine: #4a0f1a;
    --wine-ink: #3d0b15;
    --gold: #a8854e;
    --gold-deep: #8a6a3b;
    --gold-soft: rgba(168, 133, 78, .55);
    --gold-light: #dcc28f;
    --cream: #f2e9d8;
    --cream-2: #eadfc9;
    --ink: #33100f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  address { font-style: normal; }
  html, body { background: #6d6d6d; }
  body { font-family: "Doran", sans-serif; font-weight: 400; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @media screen { body { display: grid; gap: 12mm; padding: 12mm; justify-content: center; } }

  .sheet { position: relative; width: 303mm; height: 216mm; overflow: hidden; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .panel { position: absolute; top: 0; height: 216mm; overflow: hidden; }

  /* ---------- surfaces ---------- */
  .leather { background: radial-gradient(110% 75% at 50% 42%, #58141f 0%, #3d0c15 50%, #23060b 100%); color: var(--gold-light); }
  .paper   { background: radial-gradient(120% 90% at 50% 38%, #f6efe2 0%, var(--cream) 55%, var(--cream-2) 100%); color: var(--ink); }
  .grain { position: absolute; inset: 0; pointer-events: none; }
  .grain svg { display: block; width: 100%; height: 100%; }

  /* ---------- small shared pieces ---------- */
  .latin { font-family: "Cormorant", serif; font-weight: 500; direction: ltr; letter-spacing: .5em; }
  .tracked { display: flex; align-items: center; justify-content: center; gap: 3.5mm; }
  .tracked i { display: block; width: 8mm; height: .3mm; background: linear-gradient(90deg, transparent, currentColor); }
  .tracked i:last-child { background: linear-gradient(90deg, currentColor, transparent); }
  .tracked span { margin-right: -.5em; }
  .lozenge-rule { position: relative; height: .3mm; background: linear-gradient(90deg, transparent, var(--gold-soft), transparent); }
  .lozenge-rule::after { content: ""; position: absolute; left: 50%; top: 50%; width: 1.5mm; height: 1.5mm; translate: -50% -50%; rotate: 45deg; border: .3mm solid var(--gold); background: inherit; background: var(--cream); }
  .leather .lozenge-rule::after { background: #3d0c15; }
  .glyph { display: block; width: 5.5mm; height: 5.5mm; color: var(--gold); }
  .glyph svg { width: 100%; height: 100%; display: block; }
  .palm { display: inline-block; width: 3.4mm; height: 3.4mm; background: url("img/palmette.png") center / contain no-repeat; vertical-align: -.4mm; }

  /* engraved frame drawn by script (class .frame + data-inset) */
  .frame { position: absolute; pointer-events: none; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .frame rect, .frame path { fill: none; vector-effect: non-scaling-stroke; }
  .leather .frame .o { stroke: rgba(220, 194, 143, .55); stroke-width: 1.4; }
  .leather .frame .i { stroke: rgba(220, 194, 143, .25); stroke-width: 1.0; }
  .paper .frame .o { stroke: rgba(138, 106, 59, .5); stroke-width: 1.3; }
  .paper .frame .i { stroke: rgba(138, 106, 59, .22); stroke-width: 1.0; }
  .corner { position: absolute; width: 9mm; height: 9mm; background: url("img/corner.jpg") center / cover; box-shadow: 0 .4mm 1mm rgba(0,0,0,.35); }

  /* verse cartouche: two hemistichs side by side, as poetry is set in Persian books */
  .verse { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2.5mm; font-size: 9.3pt; line-height: 1.6; color: var(--wine); padding: 2.6mm 0; border-top: .3mm solid var(--gold-soft); border-bottom: .3mm solid var(--gold-soft); }
  .verse span { white-space: nowrap; }
  .verse span:first-child { text-align: left; }   /* right-hand misra, hugging the centre */
  .verse span:last-child { text-align: right; }   /* left-hand misra */
  .verse i { width: 1.4mm; height: 1.4mm; rotate: 45deg; background: var(--gold); }

  /* =========================================================
     OUTSIDE · front cover
     ========================================================= */
  .p-cover { left: 0; width: 103mm; }
  .p-cover .frame { left: calc(var(--b) + 6mm); right: 6mm; top: calc(var(--b) + 6mm); bottom: calc(var(--b) + 6mm); }
  .cover-body { position: absolute; left: var(--b); width: 100mm; top: 0; bottom: 0; display: grid; justify-items: center; align-content: center; text-align: center; padding-bottom: 6mm; }
  .cover-logo { width: 36mm; filter: sepia(.12) saturate(.85) brightness(.96) drop-shadow(0 .5mm .8mm rgba(0,0,0,.45)); }
  .cover-house { margin-top: 7mm; font-size: 10pt; color: #cdb07a; }
  .cover-rule { width: .3mm; height: 11mm; margin: 5mm 0 3mm; background: linear-gradient(to bottom, transparent, var(--gold), transparent); }
  .cover-title { font-weight: 500; font-size: 54pt; line-height: 1.15; color: #d7bc86; }
  .cover-latin { font-size: 8.8pt; color: var(--gold); margin-top: 1mm; }
  .cover-line { position: absolute; bottom: calc(var(--b) + 17mm); left: var(--b); width: 100mm; text-align: center; font-size: 9.2pt; color: #d6bb88; }

  /* =========================================================
     OUTSIDE · back
     ========================================================= */
  .p-back { left: 103mm; width: 100mm; }
  .p-back::before { content: ""; position: absolute; inset: 0; background: var(--rosette-gold) center 44% / 88mm no-repeat; opacity: .07; }
  .back-body { position: absolute; inset: calc(var(--b) + 16mm) 12mm calc(var(--b) + 14mm); display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center; }
  .back-logo { width: 14mm; filter: sepia(.12) saturate(.85) brightness(.96); }
  .back-house { font-size: 9.8pt; margin-top: 3mm; color: #cdb07a; }
  .back-event { align-self: center; display: grid; justify-items: center; gap: 3.2mm; width: 100%; }
  .back-eyebrow { font-size: 10.5pt; color: var(--gold-light); }
  .back-event .lozenge-rule { width: 30mm; margin: 1mm 0; }
  .back-big { font-size: 20pt; line-height: 1.25; font-weight: 400; color: #efe0c0; }
  .back-mid { font-size: 13pt; color: #e3d0aa; }
  .back-addr { font-size: 9.5pt; line-height: 1.9; color: #d8c49e; }
  .back-addr span { display: block; }
  .back-addr span:last-child { color: var(--gold-light); font-size: 10pt; }
  .back-qr { display: grid; grid-template-columns: auto auto; align-items: center; gap: 3.5mm; }
  .qr-plate { width: 18mm; height: 18mm; padding: 1.5mm; background: var(--cream); box-shadow: 0 0 0 .25mm var(--gold), 0 0 0 .9mm #3d0c15, 0 0 0 1.1mm rgba(220,194,143,.5); }
  .qr-plate img { width: 100%; height: 100%; display: block; }
  .qr-cap { font-size: 8.5pt; line-height: 1.85; color: #d3bf98; text-align: right; }
  .qr-cap b { display: block; font-weight: 500; font-size: 9.2pt; color: var(--gold-light); }

  /* =========================================================
     OUTSIDE · inner flap (first thing seen on opening)
     ========================================================= */
  .p-flap { left: 203mm; width: 100mm; }
  .p-flap .frame { left: 6mm; right: calc(var(--b) + 6mm); top: calc(var(--b) + 6mm); bottom: calc(var(--b) + 6mm); }
  .p-flap::before { content: ""; position: absolute; inset: 0; background: var(--rosette-ink) 50% 30% / 80mm no-repeat; opacity: .05; }
  .flap-body { position: absolute; left: 13mm; right: calc(var(--b) + 13mm); top: calc(var(--b) + 19mm); bottom: calc(var(--b) + 16mm); display: grid; align-content: center; gap: 9mm; text-align: center; justify-items: center; }
  .flap-eyebrow { font-size: 9.8pt; color: var(--gold-deep); }
  .flap-title { font-weight: 500; font-size: 21pt; line-height: 1.35; color: var(--wine); margin-top: 1mm; }
  .flap-text { font-size: 9.6pt; line-height: 2.05; text-align: justify; text-align-last: center; color: var(--ink); margin-top: 5mm; }
  .flap-body .verse { width: 100%; font-size: 8.8pt; gap: 2mm; }
  .flap-poet { font-size: 8.5pt; color: var(--gold-deep); margin-top: 1.5mm; }
  .index { width: 100%; display: grid; gap: 2.6mm; }
  .index li { list-style: none; display: grid; grid-template-columns: auto auto 1fr auto; align-items: baseline; gap: 2mm; font-size: 9.5pt; }
  .index .num { color: var(--gold-deep); width: 4mm; }
  .index .nm { font-weight: 500; color: var(--wine); }
  .index .dots { border-bottom: .3mm dotted rgba(138,106,59,.55); transform: translateY(-1mm); }
  .index .st { color: #6b4a3a; font-size: 9pt; }

  /* =========================================================
     INSIDE · three pieces
     ========================================================= */
  .p-prod { top: 0; }
  .p-prod.pos-3 { left: 0; width: 100mm; }     /* 3 mm bleed + 97 mm fold-in panel */
  .p-prod.pos-2 { left: 100mm; width: 100mm; }
  .p-prod.pos-1 { left: 200mm; width: 103mm; }
  .inside-band { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--b) + 11mm); background: linear-gradient(#4a0f1a, #33080f); }
  .inside-band svg { position: absolute; left: 0; right: 0; top: 2.2mm; height: 5mm; width: 100%; }
  .inside-band::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .5mm; background: linear-gradient(90deg, #8a6a3b, #dcc28f 50%, #8a6a3b); }
  .inside-top { position: absolute; left: 0; right: 0; top: calc(var(--b) + 7mm); height: .3mm; background: linear-gradient(90deg, transparent 2%, var(--gold-soft) 12%, var(--gold-soft) 88%, transparent 98%); }

  .prod { position: absolute; top: calc(var(--b) + 12mm); bottom: calc(var(--b) + 16mm); display: grid; grid-template-rows: auto auto auto auto 1fr auto; justify-items: center; text-align: center; }
  .pos-3 .prod { left: calc(var(--b) + 7.5mm); right: 7.5mm; }
  .pos-2 .prod { left: 7.5mm; right: 7.5mm; }
  .pos-1 .prod { left: 7.5mm; right: calc(var(--b) + 7.5mm); }

  .prod-num { width: 7mm; height: 7mm; border-radius: 50%; display: grid; place-items: center; font-size: 9.2pt; color: var(--gold-deep); box-shadow: inset 0 0 0 .3mm var(--gold); }
  .prod-name { font-weight: 500; font-size: 23pt; line-height: 1.35; color: var(--wine); margin-top: 1.5mm; }
  .prod-latin { font-size: 7.8pt; color: var(--gold-deep); }
  .prod-figure { position: relative; width: 100%; height: 72mm; margin: 2.5mm 0 3mm; display: grid; place-items: center; }
  .prod-figure::before { content: ""; position: absolute; left: 50%; top: 50%; width: 70mm; height: 70mm; translate: -50% -50%; background: var(--rosette-ink) center / contain no-repeat; opacity: .06; }
  .prod-figure img { position: relative; height: 72mm; width: auto; max-width: 82mm; object-fit: contain; filter: drop-shadow(0 1.4mm 1.8mm rgba(70, 35, 12, .28)) drop-shadow(0 .3mm .4mm rgba(70, 35, 12, .2)); }
  .prod-story { font-size: 10.5pt; color: var(--gold-deep); display: flex; justify-content: center; align-items: center; gap: 2mm; margin-bottom: 2mm; }
  .prod-text { font-size: 9.2pt; line-height: 1.98; text-align: justify; text-align-last: center; color: var(--ink); align-self: start; }
  .prod .verse { width: 100%; margin-top: 3mm; }
  .prod-specs { display: flex; justify-content: center; gap: 2.2mm; align-items: center; margin-top: 3.2mm; font-size: 8.8pt; color: #6b4a3a; }
  .prod-specs i { width: 1mm; height: 1mm; rotate: 45deg; background: var(--gold); }

  /* guides */
  .guides .sheet::after { content: ""; position: absolute; inset: var(--b); outline: .3mm dashed rgba(0,160,255,.7); pointer-events: none; z-index: 50; }
  .fold { display: none; }
  .guides .fold { display: block; position: absolute; top: 0; bottom: 0; width: 0; border-left: .25mm dashed rgba(255,60,120,.8); z-index: 50; }
  /* ---------- print strength (press check: thin type & hairlines fill in) ---------- */
  .glyph svg * { stroke-width: 1.55; }
  .frame .n { stroke-width: 1.2 !important; }
</style>
</head>
<body>

<!-- ================= OUTSIDE ================= -->
<section class="sheet" id="outside">
  <!-- front cover -->
  <div class="panel p-cover leather">
    <div class="grain" data-grain="dark"></div>
    <div class="frame" data-frame></div>
    <span class="corner" style="left: calc(var(--b) + 4mm); top: calc(var(--b) + 4mm)"></span>
    <span class="corner" style="right: 4mm; top: calc(var(--b) + 4mm)"></span>
    <span class="corner" style="left: calc(var(--b) + 4mm); bottom: calc(var(--b) + 4mm)"></span>
    <span class="corner" style="right: 4mm; bottom: calc(var(--b) + 4mm)"></span>
    <div class="cover-body">
      <img class="cover-logo" data-logo alt="نادر">
      <p class="cover-house" data-t="cover.house"></p>
      <span class="cover-rule"></span>
      <h1 class="cover-title" data-t="cover.title"></h1>
      <p class="cover-latin latin tracked"><i></i><span data-t="cover.latin"></span><i></i></p>
    </div>
    <p class="cover-line" data-t="cover.line"></p>
  </div>

  <!-- back -->
  <div class="panel p-back leather">
    <div class="grain" data-grain="dark"></div>
    <div class="back-body">
      <div>
        <img class="back-logo" data-logo alt="">
        <p class="back-house" data-t="cover.house"></p>
      </div>
      <div class="back-event">
        <p class="back-eyebrow" data-t="back.eyebrow"></p>
        <span class="lozenge-rule"></span>
        <span class="glyph" data-glyph="rosette"></span>
        <p class="back-big" data-e="date"></p>
        <span class="glyph" data-glyph="dusk"></span>
        <p class="back-mid" data-e="time"></p>
        <span class="glyph" data-glyph="gate"></span>
        <address class="back-addr" data-e="address"></address>
      </div>
      <div class="back-qr">
        <p class="qr-cap"><b data-t="back.qrCaption"></b><span data-t="back.qrSub"></span></p>
        <div class="qr-plate"><img src="../print/qr.svg" alt="QR"></div>
      </div>
    </div>
  </div>

  <!-- inner flap -->
  <div class="panel p-flap paper">
    <div class="grain" data-grain="light"></div>
    <div class="frame" data-frame></div>
    <div class="flap-body">
      <div>
        <p class="flap-eyebrow"><span class="palm"></span> <span data-t="intro.eyebrow"></span> <span class="palm"></span></p>
        <h2 class="flap-title" data-t="intro.title"></h2>
        <p class="flap-text" data-t="intro.text"></p>
      </div>
      <div style="width:100%">
        <p class="verse" data-verse="intro.verse"></p>
        <p class="flap-poet" data-t="intro.poet"></p>
      </div>
      <ol class="index" data-index></ol>
    </div>
  </div>

  <span class="fold" style="left: 103mm"></span><span class="fold" style="left: 203mm"></span>
</section>

<!-- ================= INSIDE ================= -->
<section class="sheet paper" id="inside">
  <div class="grain" data-grain="light"></div>
  <div class="inside-top"></div>
  <div class="panel p-prod pos-3" data-prod="2"></div>
  <div class="panel p-prod pos-2" data-prod="1"></div>
  <div class="panel p-prod pos-1" data-prod="0"></div>
  <div class="inside-band"><svg data-frieze preserveAspectRatio="xMidYMid slice"></svg></div>
  <span class="fold" style="left: 100mm"></span><span class="fold" style="left: 200mm"></span>
</section>

<template id="prod-tpl">
  <div class="prod">
    <span class="prod-num" data-p="n"></span>
    <h3 class="prod-name" data-p="name"></h3>
    <p class="prod-latin latin tracked"><span data-p="latin"></span></p>
    <figure class="prod-figure"><img data-p-img alt=""></figure>
    <div>
      <p class="prod-story"><span class="palm"></span><span data-p="story"></span><span class="palm"></span></p>
      <p class="prod-text" data-p="text"></p>
    </div>
    <div style="width:100%">
      <p class="verse" data-p-verse></p>
      <p class="prod-specs" data-p-specs></p>
    </div>
  </div>
</template>

<script src="../js/config.js"></script>
<script src="../js/motifs.js"></script>
<script src="content.js"></script>
<script>
  const C = window.NADER_CONFIG, M = window.NADER_MOTIFS, B = window.BROCHURE;
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const get = (p, o = B) => p.split(".").reduce((a, k) => a && a[k], o);
  const svgURL = (svg) => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  if (location.search.includes("guides")) document.body.classList.add("guides");

  const verseHTML = (v) => `<span>${v[0]}</span><i></i><span>${v[1]}</span>`;

  // products (inside, read right → left: ۱ ۲ ۳)
  const tpl = document.getElementById("prod-tpl");
  $$("[data-prod]").forEach((panel) => {
    const p = B.products[+panel.dataset.prod];
    const node = tpl.content.cloneNode(true);
    $$("[data-p]", node).forEach((el) => { el.textContent = p[el.dataset.p]; });
    node.querySelector("[data-p-img]").src = p.image;
    node.querySelector("[data-p-img]").alt = p.name;
    node.querySelector("[data-p-verse]").innerHTML = verseHTML(p.verse);
    node.querySelector("[data-p-specs]").innerHTML = p.specs.map((s) => `<span>${s}</span>`).join("<i></i>");
    panel.appendChild(node);
  });

  $$("[data-t]").forEach((el) => { el.textContent = get(el.dataset.t); });
  $$("[data-verse]").forEach((el) => { el.innerHTML = verseHTML(get(el.dataset.verse)); });
  $$("[data-index]").forEach((el) => {
    el.innerHTML = B.products.map((p) => `<li><span class="num">${p.n}</span><span class="nm">${p.name}</span><span class="dots"></span><span class="st">${p.story}</span></li>`).join("");
  });
  // event details come from the website config — one source of truth
  $$("[data-e]").forEach((el) => {
    const v = C.event[el.dataset.e];
    if (Array.isArray(v)) v.forEach((l) => { const s = document.createElement("span"); s.textContent = l; el.appendChild(s); });
    else el.textContent = v;
  });
  $$("[data-logo]").forEach((el) => { el.src = "../" + C.assets.logo; });
  $$("[data-glyph]").forEach((el) => { el.innerHTML = M.glyphs[el.dataset.glyph]; });

  const root = document.documentElement.style;
  root.setProperty("--rosette-gold", svgURL(M.doorArt()));
  root.setProperty("--rosette-ink", svgURL(M.doorArt().replaceAll("#c9a86e", "#5a1a22")));

  // Persepolis stepped frieze along the inside base band
  const fr = document.querySelector("[data-frieze]");
  const unit = 24, n = 60;
  fr.setAttribute("viewBox", `0 0 ${unit * n} 20`);
  fr.innerHTML = Array.from({ length: n }, (_, i) =>
    `<path transform="translate(${i * unit + 3} 3) scale(.75)" d="M0 20 V14 H4 V8 H8 V2 H16 V8 H20 V14 H24 V20" fill="none" stroke="#c9a86e" stroke-width="1.1" opacity=".75"/>`).join("");

  // grain — vector noise, rendered at print resolution
  const grain = (tone) => `<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 800 600">
    <filter id="g${tone}"><feTurbulence type="fractalNoise" baseFrequency="${tone === "dark" ? ".9" : "1.1"}" numOctaves="3" seed="${tone === "dark" ? 7 : 3}"/>
    <feColorMatrix values="0 0 0 0 ${tone === "dark" ? ".06" : ".45"}  0 0 0 0 ${tone === "dark" ? ".01" : ".34"}  0 0 0 0 ${tone === "dark" ? ".0" : ".2"}  0 0 0 ${tone === "dark" ? ".5" : ".2"} 0"/></filter>
    <rect width="800" height="600" filter="url(#g${tone})"/>
    <filter id="m${tone}"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="11"/>
    <feColorMatrix values="0 0 0 0 ${tone === "dark" ? ".03" : ".55"}  0 0 0 0 ${tone === "dark" ? ".0" : ".42"}  0 0 0 0 ${tone === "dark" ? ".0" : ".26"}  0 0 0 ${tone === "dark" ? ".45" : ".07"} 0"/></filter>
    <rect width="800" height="600" filter="url(#m${tone})"/></svg>`;
  $$("[data-grain]").forEach((el) => { el.innerHTML = grain(el.dataset.grain); });

  // engraved frames
  $$("[data-frame]").forEach((el) => {
    const { width: w, height: h } = el.getBoundingClientRect();
    const i = 6;
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}"><rect class="o" x="0" y="0" width="${w}" height="${h}"/>
      <rect class="i" x="${i}" y="${i}" width="${w - 2 * i}" height="${h - 2 * i}"/></svg>`;
  });
</script>
</body>
</html>
